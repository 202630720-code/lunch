<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모과제 - 스프링 노트 AI 과제 우선순위</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #fffdf7;
            --paper-line: #d8e5e5;
            --margin-line: #ff8b8b;
            --ink-color: #2b2b2b;
            --accent-color: #3b6e4c;
            --stamp-color: #c93b2b;
            --notebook-shadow: rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #c2b48d;
            background-image: 
                radial-gradient(#ab9a74 1.5px, transparent 1.5px),
                linear-gradient(135deg, #d3c49a 0%, #b8a97f 100%);
            background-size: 24px 24px, 100% 100%;
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--ink-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .notebook-wrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            display: flex;
        }

        .spring-spine {
            width: 44px;
            background: linear-gradient(to right, #2b241f, #14100d, #2b241f);
            border-radius: 12px 0 0 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 25px 0;
            box-shadow: -4px 6px 15px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .ring-coil {
            width: 52px;
            height: 14px;
            background: linear-gradient(180deg, #ffffff 0%, #888888 50%, #d4d4d4 100%);
            border-radius: 8px;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
            margin-left: -10px;
            position: relative;
        }

        .notebook-page {
            flex: 1;
            background-color: var(--paper-bg);
            border-radius: 0 12px 12px 0;
            box-shadow: 10px 15px 35px var(--notebook-shadow), inset 0 0 80px rgba(220,210,180,0.25);
            padding: 40px 35px 40px 50px;
            position: relative;
            background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
            background-size: 100% 32px;
            border-left: 1px solid #e0d0b0;
        }

        .notebook-page::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 12px;
            background-image: radial-gradient(circle, #2b241f 40%, transparent 45%);
            background-size: 12px 36px;
            opacity: 0.85;
        }

        .margin-line {
            position: absolute;
            top: 0;
            left: 38px;
            width: 2px;
            height: 100%;
            background-color: var(--margin-line);
            opacity: 0.6;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #998a78;
            padding-bottom: 15px;
        }

        .title {
            font-family: 'Gamja Flower', cursive;
            font-size: 2.5rem;
            color: #2c251e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tape-btn {
            background-color: rgba(245, 225, 130, 0.9);
            border: none;
            padding: 8px 18px;
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.4rem;
            color: #3d3000;
            cursor: pointer;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.15);
            transform: rotate(3deg);
            transition: transform 0.2s, background-color 0.2s;
            border-left: 2px dashed #d0b040;
            border-right: 2px dashed #d0b040;
        }

        .tape-btn:hover {
            transform: rotate(-1deg) scale(1.05);
            background-color: rgba(255, 235, 140, 1);
        }

        .steps-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: rgba(220, 205, 180, 0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .step-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-family: 'Gamja Flower', cursive;
            font-size: 1.3rem;
            color: #6b5e50;
            border-radius: 6px;
            transition: 0.3s;
        }

        .step-tab.active {
            background-color: #fff;
            color: var(--accent-color);
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-family: 'Gamja Flower', cursive;
            font-size: 1.4rem;
            margin-bottom: 4px;
            color: #3b322a;
        }

        input[type="text"], input[type="datetime-local"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #8c7d6b;
            font-size: 1rem;
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--ink-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-bottom-color: var(--accent-color);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            display: inline-block;
            background: #3b6e4c;
            color: white;
            border: none;
            padding: 10px 22px;
            font-family: 'Gamja Flower', cursive;
            font-size: 1.4rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(59, 110, 76, 0.3);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover {
            background: #2d543a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #7a6a5a;
            box-shadow: 0 4px 8px rgba(122, 106, 90, 0.3);
        }

        .btn-secondary:hover {
            background: #635446;
        }

        .task-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #d9cdbd;
            border-left: 4px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #c93b2b;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .result-header {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .stamp {
            position: absolute;
            top: -10px;
            right: 10px;
            border: 3px double var(--stamp-color);
            color: var(--stamp-color);
            font-family: 'Gamja Flower', cursive;
            font-size: 1.5rem;
            padding: 4px 12px;
            border-radius: 6px;
            transform: rotate(-10deg);
            opacity: 0.85;
            pointer-events: none;
        }

        .timeline-item {
            position: relative;
            padding-left: 22px;
            margin-bottom: 18px;
            border-left: 2px dashed var(--accent-color);
        }

        .timeline-item::before {
            content: '📌';
            position: absolute;
            left: -11px;
            top: -2px;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            background: #e3ede6;
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 12, 0.92);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #060913;
            padding: 24px;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(255, 0, 85, 0.15);
            text-align: center;
            border: 1px solid #1f293d;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            right: 18px;
            color: #00ffcc;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-modal:hover {
            color: #ff0055;
            transform: scale(1.1);
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        canvas {
            border: 2px solid #00ffcc;
            border-radius: 8px;
            background-color: #050508;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="notebook-wrapper">
        <div class="spring-spine">
            <div class="ring-coil"></div><div class="ring-coil"></div><div class="ring-coil"></div>
            <div class="ring-coil"></div><div class="ring-coil"></div><div class="ring-coil"></div>
            <div class="ring-coil"></div><div class="ring-coil"></div>
        </div>

        <div class="notebook-page">
            <div class="margin-line"></div>

            <div class="header">
                <div class="title">📓 모과제 스프링 노트</div>
                <button class="tape-btn" onclick="openGameModal()">🎮 머리 식히기 (게임)</button>
            </div>

            <div class="steps-bar">
                <div class="step-tab active" id="tab-1">1. 과제 작성</div>
                <div class="step-tab" id="tab-2">2. 남은 시간</div>
                <div class="step-tab" id="tab-3">3. AI 로드맵</div>
            </div>

            <div class="step-content active" id="step-1">
                <div class="form-group">
                    <label for="task-name">과제 이름을 적어주세요</label>
                    <input type="text" id="task-name" placeholder="예: 데이터 구조 과제 제출">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-deadline">마감일</label>
                        <input type="datetime-local" id="task-deadline">
                    </div>
                    <div class="form-group">
                        <label for="task-hours">소요 예상 시간 (시간)</label>
                        <input type="number" id="task-hours" min="0.5" step="0.5" placeholder="예: 2.5">
                    </div>
                </div>

                <div class="form-group">
                    <label for="task-difficulty">난이도</label>
                    <select id="task-difficulty">
                        <option value="1">⭐ 아주 쉬움</option>
                        <option value="2">⭐⭐ 쉬움</option>
                        <option value="3" selected>⭐⭐⭐ 보통</option>
                        <option value="4">⭐⭐⭐⭐ 어려움</option>
                        <option value="5">⭐⭐⭐⭐⭐ 매우 어려움</option>
                    </select>
                </div>

                <button class="btn" onclick="addTask()">+ 과제 추가</button>

                <div class="task-list" id="task-list"></div>

                <div style="margin-top: 25px; text-align: right;">
                    <button class="btn btn-secondary" onclick="goToStep(2)">다음: 남은 시간 설정 ➔</button>
                </div>
            </div>

            <div class="step-content" id="step-2">
                <div class="form-group" style="margin-top: 20px;">
                    <label for="available-hours">오늘 사용할 수 있는 총 집중 시간 (시간)</label>
                    <input type="number" id="available-hours" min="1" max="24" value="4" style="font-size: 1.5rem; text-align: center;">
                </div>

                <p style="font-family: 'Gamja Flower', cursive; font-size: 1.25rem; color: #555; text-align: center; margin-top: 20px;">
                    💡 AI 알고리즘이 마감 긴급도와 난이도를 계산하여 최적의 실행 순서를 배치해 드립니다.
                </p>

                <div style="margin-top: 40px; display: flex; justify-content: space-between;">
                    <button class="btn btn-secondary" onclick="goToStep(1)">⬅ 이전 단계</button>
                    <button class="btn" onclick="calculatePriority()">🔥 AI 우선순위 분석받기</button>
                </div>
            </div>

            <div class="step-content" id="step-3">
                <div class="result-header">
                    <h2 style="font-family: 'Gamja Flower', cursive; font-size: 2rem;">📋 과제 우선순위 타임라인</h2>
                    <div class="stamp">우선순위 확정</div>
                </div>

                <div id="result-container"></div>

                <div style="margin-top: 25px; text-align: center;">
                    <button class="btn btn-secondary" onclick="goToStep(1)">🔄 다시 작성하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 미니게임 모달 -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeGameModal()">&times;</span>
            <div class="game-title">⚡ 그저만든 미니겜 ⚡</div>
            <p style="color: #8a99ad; font-size: 0.85rem; margin-bottom: 12px; font-family: sans-serif;">
                WASD: 이동 | 클릭: 공격 | Q: 무기 전환 | 🟢 힐 아이템 먹기 | 💡 보스 탄환 반사 주의!
            </p>
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>
    </div>

    <script>
        // --- 1. 과제 관리 로직 ---
        let tasks = [];

        function addTask() {
            const name = document.getElementById('task-name').value.trim();
            const deadline = document.getElementById('task-deadline').value;
            const hours = parseFloat(document.getElementById('task-hours').value);
            const difficulty = parseInt(document.getElementById('task-difficulty').value);

            if (!name || !deadline || isNaN(hours)) {
                alert('과제 이름, 마감일, 예상 시간을 입력해주세요!');
                return;
            }

            tasks.push({ id: Date.now(), name, deadline: new Date(deadline), hours, difficulty });
            document.getElementById('task-name').value = '';
            document.getElementById('task-hours').value = '';
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            listEl.innerHTML = '';
            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div>
                        <h4 style="font-size:1.1rem; margin-bottom:2px;">${task.name}</h4>
                        <p style="font-size:0.85rem; color:#666;">⏰ 마감: ${task.deadline.toLocaleString()} | ⏳ ${task.hours}시간 | ⭐${task.difficulty}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">✖</button>
                `;
                listEl.appendChild(card);
            });
        }

        function goToStep(stepNum) {
            document.querySelectorAll('.step-tab').forEach((tab, idx) => tab.classList.toggle('active', idx === stepNum - 1));
            document.querySelectorAll('.step-content').forEach((content, idx) => content.classList.toggle('active', idx === stepNum - 1));
        }

        function calculatePriority() {
            if (tasks.length === 0) {
                alert('최소 하나 이상의 과제를 등록해주세요!');
                goToStep(1);
                return;
            }

            const availableHours = parseFloat(document.getElementById('available-hours').value) || 4;
            const now = new Date();

            const scoredTasks = tasks.map(task => {
                const hoursLeft = Math.max(0.5, (task.deadline - now) / (1000 * 60 * 60));
                const urgencyScore = (100 / hoursLeft) * 2;
                const difficultyScore = task.difficulty * 1.5;
                return { ...task, score: urgencyScore + difficultyScore, hoursLeft };
            });

            scoredTasks.sort((a, b) => b.score - a.score);

            const resultEl = document.getElementById('result-container');
            resultEl.innerHTML = '';
            let currentAllocatedTime = 0;

            scoredTasks.forEach((task, index) => {
                const isFit = (currentAllocatedTime + task.hours) <= availableHours;
                currentAllocatedTime += task.hours;

                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <span class="badge">우선순위 ${index + 1}위</span>
                    <h3 style="font-family: 'Gamja Flower', cursive; font-size: 1.4rem; margin-top: 3px;">${task.name}</h3>
                    <p style="font-size: 0.9rem; color: #444;">• 필요 시간: <b>${task.hours}시간</b> | 마감까지 <b>${Math.round(task.hoursLeft)}시간 남음</b></p>
                    <p style="font-size: 0.85rem; color: ${isFit ? '#3b6e4c' : '#c93b2b'}; font-weight: bold;">
                        ${isFit ? '✅ 오늘 시간 내 완료할 수 있습니다.' : '⚠️ 오늘 할당 시간을 초과하므로 분할 진행을 권장합니다.'}
                    </p>
                `;
                resultEl.appendChild(item);
            });

            goToStep(3);
        }

        // --- 2. 미니게임 : 그저만든 미니겜 ---
        let gameInitialized = false;

        function openGameModal() {
            document.getElementById('gameModal').style.display = 'flex';
            if (!gameInitialized) {
                initGame();
                gameInitialized = true;
            }
        }

        function closeGameModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function initGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            let stage = 1;
            const player = { x: canvas.width / 2, y: canvas.height - 80, radius: 15, speed: 4.8, angle: 0, weapon: 0, hp: 100, maxHp: 100 };
            const keys = {};
            const mouse = { x: 0, y: 0 };

            let playerBullets = [];
            let enemyBullets = [];
            let bulletParticles = [];
            let targets = [];
            let playerTrails = [];
            let swordArcs = [];
            let healPacks = [];

            let isSwinging = false;
            let swingProgress = 0;
            const SWING_DURATION = 10;
            const SWING_ARC = Math.PI * 0.85;

            function startStage(stageNum) {
                stage = stageNum;
                targets = [];
                enemyBullets = [];
                playerBullets = [];
                healPacks = [];

                if (stage === 1) {
                    targets = [
                        { x: 150, y: 150, radius: 16, health: 50, maxHealth: 50, type: 'trooper', lastShoot: Date.now() },
                        { x: 650, y: 150, radius: 16, health: 50, maxHealth: 50, type: 'trooper', lastShoot: Date.now() + 500 },
                        { x: 400, y: 350, radius: 16, health: 50, maxHealth: 50, type: 'trooper', lastShoot: Date.now() + 1000 }
                    ];
                } else if (stage === 2) {
                    targets = [
                        { x: 150, y: 120, radius: 18, health: 80, maxHealth: 80, type: 'droid', lastShoot: Date.now() },
                        { x: 650, y: 120, radius: 18, health: 80, maxHealth: 80, type: 'droid', lastShoot: Date.now() + 400 },
                        { x: 200, y: 350, radius: 18, health: 80, maxHealth: 80, type: 'droid', lastShoot: Date.now() + 800 },
                        { x: 600, y: 350, radius: 18, health: 80, maxHealth: 80, type: 'droid', lastShoot: Date.now() + 1200 }
                    ];
                } else if (stage === 3) {
                    // 최종 보스 다스 베이더
                    targets = [
                        { 
                            x: 400, y: 120, radius: 34, health: 600, maxHealth: 600, type: 'boss_vader', 
                            lastShoot: Date.now(), lastSlash: Date.now(), vx: 2.2, 
                            isSlashing: false, slashAngle: 0, slashArcAlpha: 0 
                        }
                    ];
                }

                // 스테이지 시작 시 힐팩 하나 스폰
                spawnHealPack();
            }

            function spawnHealPack() {
                healPacks.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 150 + Math.random() * (canvas.height - 250),
                    radius: 12,
                    pulse: 0
                });
            }

            function resetGame() {
                player.x = canvas.width / 2;
                player.y = canvas.height - 80;
                player.hp = 100;
                playerTrails = [];
                swordArcs = [];
                bulletParticles = [];
                startStage(1);
            }

            resetGame();

            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                keys[e.code] = true;
                if (e.code === 'KeyQ' || e.key.toLowerCase() === 'q') {
                    player.weapon = player.weapon === 0 ? 1 : 0;
                }
            });

            window.addEventListener('keyup', e => {
                keys[e.key.toLowerCase()] = false;
                keys[e.code] = false;
            });

            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });

            canvas.addEventListener('mousedown', e => { if (e.button === 0) attack(); });

            function attack() {
                if (player.hp <= 0) return;

                if (player.weapon === 0) {
                    playerBullets.push({
                        x: player.x + Math.cos(player.angle) * 20,
                        y: player.y + Math.sin(player.angle) * 20,
                        vx: Math.cos(player.angle) * 13,
                        vy: Math.sin(player.angle) * 13
                    });
                } else if (!isSwinging) {
                    isSwinging = true;
                    swingProgress = 0;
                }
            }

            function update() {
                if (player.hp <= 0) return;

                let isMoving = false;
                if ((keys['w'] || keys['KeyW']) && player.y > player.radius) { player.y -= player.speed; isMoving = true; }
                if ((keys['s'] || keys['KeyS']) && player.y < canvas.height - player.radius) { player.y += player.speed; isMoving = true; }
                if ((keys['a'] || keys['KeyA']) && player.x > player.radius) { player.x -= player.speed; isMoving = true; }
                if ((keys['d'] || keys['KeyD']) && player.x < canvas.width - player.radius) { player.x += player.speed; isMoving = true; }

                player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

                if (isMoving || isSwinging) {
                    playerTrails.push({ x: player.x, y: player.y, angle: player.angle, alpha: 0.5 });
                }

                playerTrails.forEach((t, i) => {
                    t.alpha -= 0.06;
                    if (t.alpha <= 0) playerTrails.splice(i, 1);
                });

                // 플레이어 검 공격 로직
                if (isSwinging) {
                    swingProgress += 1 / SWING_DURATION;
                    const currentOffset = -SWING_ARC / 2 + (SWING_ARC * swingProgress);
                    const currentAngle = player.angle + currentOffset;

                    swordArcs.push({ x: player.x, y: player.y, angle: currentAngle, length: 60, alpha: 0.9 });

                    const swordTipX = player.x + Math.cos(currentAngle) * 65;
                    const swordTipY = player.y + Math.sin(currentAngle) * 65;

                    targets.forEach(t => {
                        if (Math.hypot(t.x - swordTipX, t.y - swordTipY) < t.radius + 18) {
                            // 🔥 검 데미지 부여 (보스에게 대폭 상향: 25 데미지)
                            const damage = t.type === 'boss_vader' ? 25 : 12;
                            t.health -= damage;

                            // 타격 이펙트 파티클
                            for (let p = 0; p < 5; p++) {
                                bulletParticles.push({
                                    x: swordTipX, y: swordTipY,
                                    vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                                    color: '#00ffcc', size: Math.random() * 4 + 2, alpha: 1
                                });
                            }
                        }
                    });

                    if (swingProgress >= 1) isSwinging = false;
                }

                swordArcs.forEach((sa, i) => {
                    sa.alpha -= 0.1;
                    if (sa.alpha <= 0) swordArcs.splice(i, 1);
                });

                // 힐팩 획득 체크
                healPacks.forEach((hp, i) => {
                    hp.pulse += 0.05;
                    if (Math.hypot(player.x - hp.x, player.y - hp.y) < player.radius + hp.radius) {
                        player.hp = Math.min(player.maxHp, player.hp + 30);
                        healPacks.splice(i, 1);
                        
                        // 힐 이펙트 생성
                        for (let p = 0; p < 12; p++) {
                            bulletParticles.push({
                                x: player.x, y: player.y,
                                vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                                color: '#00ff66', size: Math.random() * 4 + 2, alpha: 1
                            });
                        }
                    }
                });

                // 힐팩 지속적 스폰 (확률)
                if (Math.random() < 0.0015 && healPacks.length < 2) {
                    spawnHealPack();
                }

                // 총알 이동 및 반사/피격 처리
                playerBullets.forEach((b, i) => {
                    b.x += b.vx; b.y += b.vy;

                    bulletParticles.push({
                        x: b.x, y: b.y,
                        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                        color: '#00ffcc', size: Math.random() * 3 + 1, alpha: 0.8
                    });

                    targets.forEach(t => {
                        const dist = Math.hypot(t.x - b.x, t.y - b.y);

                        // ⚔️ 다스 베이더 검 휘두르기 시 탄환 반사 (Deflect)
                        if (t.type === 'boss_vader' && t.isSlashing && dist < t.radius + 40) {
                            // 총알을 적 탄환으로 변환 및 반사 튕기기
                            enemyBullets.push({
                                x: b.x, y: b.y,
                                vx: -b.vx * 1.1,
                                vy: -b.vy * 1.1
                            });
                            playerBullets.splice(i, 1);

                            // 반사 이펙트
                            for (let p = 0; p < 8; p++) {
                                bulletParticles.push({
                                    x: b.x, y: b.y,
                                    vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
                                    color: '#ff0033', size: Math.random() * 4 + 2, alpha: 1
                                });
                            }
                            return;
                        }

                        // 일반 피격 (보스 총알 데미지는 저항)
                        if (dist < t.radius) {
                            const bulletDmg = t.type === 'boss_vader' ? 8 : 20;
                            t.health -= bulletDmg;
                            playerBullets.splice(i, 1);

                            for (let p = 0; p < 6; p++) {
                                bulletParticles.push({
                                    x: b.x, y: b.y,
                                    vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                                    color: '#ff0055', size: Math.random() * 4 + 2, alpha: 1
                                });
                            }
                        }
                    });
                });

                bulletParticles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy;
                    p.alpha -= 0.05;
                    if (p.alpha <= 0) bulletParticles.splice(i, 1);
                });

                // 적 행동 / 보스 공격 모션 패턴
                const now = Date.now();
                targets.forEach(t => {
                    if (t.type === 'boss_vader') {
                        // 보스 이동
                        t.x += t.vx;
                        if (t.x < 120 || t.x > canvas.width - 120) t.vx *= -1;

                        // 🔴 보스 검 휘두르기 모션 주기 (2.5초마다 검을 휘두르며 탄환 반사 준비)
                        if (now - t.lastSlash > 2500) {
                            t.isSlashing = true;
                            t.slashAngle = Math.atan2(player.y - t.y, player.x - t.x);
                            t.slashArcAlpha = 1.0;
                            t.lastSlash = now;

                            setTimeout(() => { t.isSlashing = false; }, 600);
                        }

                        if (t.slashArcAlpha > 0) t.slashArcAlpha -= 0.04;

                        // 보스 3방향 총알 발사 패턴
                        if (now - t.lastShoot > 2000) {
                            const baseAngle = Math.atan2(player.y - t.y, player.x - t.x);
                            [-0.3, 0, 0.3].forEach(offset => {
                                enemyBullets.push({
                                    x: t.x + Math.cos(baseAngle + offset) * 35,
                                    y: t.y + Math.sin(baseAngle + offset) * 35,
                                    vx: Math.cos(baseAngle + offset) * 3.8,
                                    vy: Math.sin(baseAngle + offset) * 3.8
                                });
                            });
                            t.lastShoot = now;
                        }
                    } else {
                        const cooldown = t.type === 'droid' ? 2200 : 2800;
                        if (now - t.lastShoot > cooldown) {
                            const angleToPlayer = Math.atan2(player.y - t.y, player.x - t.x);
                            enemyBullets.push({
                                x: t.x + Math.cos(angleToPlayer) * 18,
                                y: t.y + Math.sin(angleToPlayer) * 18,
                                vx: Math.cos(angleToPlayer) * 3,
                                vy: Math.sin(angleToPlayer) * 3
                            });
                            t.lastShoot = now;
                        }
                    }
                });

                // 적 탄환 이동 및 적중
                enemyBullets.forEach((eb, i) => {
                    eb.x += eb.vx; eb.y += eb.vy;
                    if (Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius) {
                        player.hp -= 12;
                        enemyBullets.splice(i, 1);
                        if (player.hp <= 0) {
                            setTimeout(() => {
                                alert('💀 패배했습니다! 처음부터 다시 도전하세요.');
                                resetGame();
                            }, 50);
                        }
                    }
                });

                // 적 제거 체크 및 스테이지 진행
                targets = targets.filter(t => t.health > 0);
                if (targets.length === 0) {
                    if (stage < 3) {
                        alert(`🎉 STAGE ${stage} 클리어! 다음 구역으로 진입합니다.`);
                        startStage(stage + 1);
                    } else {
                        alert('🏆 축하합니다! 다스 베이더를 물리치고 우주선을 탈출했습니다!');
                        resetGame();
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 🛸 우주선 내부 스페이시한 바닥 & 벽면 렌더링
                ctx.fillStyle = '#080c14';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 우주선 벽면 사이드 조명 패널
                ctx.fillStyle = 'rgba(0, 255, 204, 0.08)';
                ctx.fillRect(0, 0, 40, canvas.height);
                ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);

                // 바닥 우주선 금속 그리드
                ctx.strokeStyle = '#121e36';
                ctx.lineWidth = 1;
                for (let x = 40; x < canvas.width - 40; x += 50) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 50) {
                    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(canvas.width - 40, y); ctx.stroke();
                }

                // 우주선 상단 전광 네온 가이드 라인
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(40, 0); ctx.lineTo(40, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(canvas.width - 40, 0); ctx.lineTo(canvas.width - 40, canvas.height); ctx.stroke();

                // 💚 힐 아이템 렌더링
                healPacks.forEach(hp => {
                    ctx.save();
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 10 + Math.sin(hp.pulse) * 5;
                    ctx.fillStyle = '#00ff66';
                    ctx.beginPath(); ctx.arc(hp.x, hp.y, hp.radius, 0, Math.PI * 2); ctx.fill();

                    // '+' 크로스 마크
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(hp.x - 6, hp.y - 2, 12, 4);
                    ctx.fillRect(hp.x - 2, hp.y - 6, 4, 12);
                    ctx.restore();
                });

                // 플레이어 잔상
                playerTrails.forEach(t => {
                    ctx.save();
                    ctx.translate(t.x, t.y);
                    ctx.rotate(t.angle);
                    ctx.fillStyle = `rgba(0, 255, 204, ${t.alpha * 0.3})`;
                    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                });

                // 플레이어 검 휘두르기 궤적
                swordArcs.forEach(sa => {
                    ctx.save();
                    ctx.translate(sa.x, sa.y);
                    ctx.rotate(sa.angle);
                    ctx.strokeStyle = `rgba(0, 255, 204, ${sa.alpha})`;
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 15;
                    ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(sa.length, 0); ctx.stroke();
                    ctx.restore();
                });

                // 파티클
                bulletParticles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                // 적 / 최종보스 렌더링
                targets.forEach(t => {
                    if (t.type === 'boss_vader') {
                        ctx.save();
                        ctx.translate(t.x, t.y);

                        // 다스 베이더 광원 오라
                        ctx.shadowColor = '#ff0033';
                        ctx.shadowBlur = 30;
                        ctx.fillStyle = '#111';
                        ctx.beginPath(); ctx.arc(0, 0, t.radius, 0, Math.PI * 2); ctx.fill();

                        // 헬멧 및 마스크
                        ctx.fillStyle = '#222';
                        ctx.beginPath(); ctx.arc(0, -4, t.radius - 8, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#ff0033';
                        ctx.fillRect(-10, -7, 6, 3);
                        ctx.fillRect(4, -7, 6, 3);

                        // 🔴 보스가 검을 휘두르는 모션 및 검궤적 (Slash Arc)
                        if (t.slashArcAlpha > 0) {
                            ctx.save();
                            ctx.rotate(t.slashAngle - Math.PI / 2);
                            ctx.strokeStyle = `rgba(255, 0, 51, ${t.slashArcAlpha})`;
                            ctx.shadowColor = '#ff0033';
                            ctx.shadowBlur = 20;
                            ctx.lineWidth = 8;
                            ctx.beginPath();
                            ctx.arc(0, 0, 55, -Math.PI / 3, Math.PI / 3);
                            ctx.stroke();
                            ctx.restore();
                        }

                        // 다스 베이더 광선검
                        ctx.strokeStyle = '#ff0033';
                        ctx.shadowBlur = 20;
                        ctx.lineWidth = 6;
                        ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(65, 15); ctx.stroke();

                        ctx.restore();

                        // 보스 대형 HUD 체력바
                        ctx.fillStyle = '#ff0055';
                        ctx.font = 'bold 16px Orbitron, sans-serif';
                        ctx.fillText('FINAL BOSS : DARTH VADER', canvas.width / 2 - 120, 25);

                        ctx.fillStyle = '#222';
                        ctx.fillRect(canvas.width / 2 - 200, 35, 400, 16);
                        ctx.fillStyle = '#ff0055';
                        ctx.fillRect(canvas.width / 2 - 200, 35, (t.health / t.maxHealth) * 400, 16);
                        ctx.strokeStyle = '#ff0055';
                        ctx.strokeRect(canvas.width / 2 - 200, 35, 400, 16);

                    } else {
                        // 일반 적
                        ctx.fillStyle = t.type === 'droid' ? '#e67e22' : '#ffffff';
                        ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#000'; ctx.fillRect(t.x - 5, t.y - 2, 10, 4);

                        // HP 바
                        ctx.fillStyle = '#ff0055';
                        ctx.fillRect(t.x - 15, t.y - t.radius - 8, (t.health / t.maxHealth) * 30, 4);
                    }
                });

                // 적 총알
                ctx.save();
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ff3300';
                enemyBullets.forEach(eb => {
                    ctx.beginPath(); ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2); ctx.fill();
                });
                ctx.restore();

                // 플레이어 총알
                ctx.save();
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffffff';
                playerBullets.forEach(b => {
                    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
                });
                ctx.restore();

                // 플레이어
                if (player.hp > 0) {
                    ctx.save();
                    ctx.translate(player.x, player.y);

                    let renderAngle = player.angle;
                    if (isSwinging) {
                        const currentOffset = -SWING_ARC / 2 + (SWING_ARC * swingProgress);
                        renderAngle += currentOffset;
                    }
                    ctx.rotate(renderAngle);

                    if (player.weapon === 0) {
                        ctx.fillStyle = '#00ffcc'; ctx.fillRect(10, 2, 16, 5);
                    } else {
                        ctx.strokeStyle = '#00ffcc';
                        ctx.shadowColor = '#00ffcc';
                        ctx.shadowBlur = 15;
                        ctx.lineWidth = 5;
                        ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(55, 0); ctx.stroke();
                    }

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#00b894';
                    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                // 플레이어 HUD (STAGE & HP)
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 15px Orbitron, sans-serif';
                ctx.fillText(`STAGE : ${stage} / 3`, 50, 30);

                ctx.fillStyle = '#222';
                ctx.fillRect(50, 40, 150, 14);
                ctx.fillStyle = player.hp > 30 ? '#00b894' : '#ff0055';
                ctx.fillRect(50, 40, (player.hp / player.maxHp) * 150, 14);
                ctx.strokeStyle = '#00ffcc';
                ctx.strokeRect(50, 40, 150, 14);
            }

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        }
    </script>
</body>
